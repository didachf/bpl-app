<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #5598e7; } a:hover { color: #86b6ef; }
    .lbl { font-size: 13px; letter-spacing: .01em; }
    .num { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .cap { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #898781; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #1a1a19; color: #ffffff; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 10px 20px;">
    <div style="font-size: 13px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: #898781;">Logbook BPL</div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0ca30c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      <span class="lbl" style="color: #898781;">Al día</span>
    </div>
  </div>

  <div style="padding: 26px 20px 0 20px;">
    <div class="cap">Acumulado del cuaderno</div>
    <div class="num" style="font-size: 76px; line-height: 1; font-weight: 500; letter-spacing: -.03em; margin-top: 10px;">14:20</div>
    <div class="lbl" style="color: #c3c2b7; margin-top: 8px;">horas de vuelo</div>
  </div>

  <div style="margin: 30px 20px 0 20px; padding: 16px 0; border-top: 1px solid #2c2c2a; border-bottom: 1px solid #2c2c2a; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));">
    <div>
      <div class="num" style="font-size: 26px; font-weight: 500;">23</div>
      <div class="lbl" style="color: #898781; font-size: 12px; margin-top: 2px;">vuelos</div>
    </div>
    <div>
      <div class="num" style="font-size: 26px; font-weight: 500;">25</div>
      <div class="lbl" style="color: #898781; font-size: 12px; margin-top: 2px;">aterrizajes</div>
    </div>
    <div>
      <div class="num" style="font-size: 26px; font-weight: 500;">19</div>
      <div class="lbl" style="color: #898781; font-size: 12px; margin-top: 2px;">inflados</div>
    </div>
  </div>

  <div style="margin: 26px 20px 0 20px; padding: 13px 14px; border-radius: 8px; background: #24231f; display: flex; align-items: center; gap: 11px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fab219" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4"/><path d="M12 17.5v.01"/></svg>
    <div style="flex-grow: 1;">
      <div class="lbl" style="font-weight: 500;">Vuelo sin rematar</div>
      <div class="lbl" style="color: #898781; font-size: 12px;">31 ago, Agramunt. Faltan 6 campos</div>
    </div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#898781" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </div>

  <div style="margin: 10px 20px 0 20px; padding: 13px 14px; border: 1px solid #2c2c2a; border-radius: 8px; display: flex; align-items: center; gap: 11px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#898781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <div style="flex-grow: 1;">
      <div class="lbl" style="color: #c3c2b7;">Vigencia</div>
      <div class="lbl" style="color: #898781; font-size: 12px;">Se activa al emitirse la licencia</div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 20px 16px 20px;">
    <div style="height: 56px; border-radius: 8px; background: #2a78d6; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 500;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      Cerrar vuelo
    </div>
  </div>

  <div style="height: 64px; border-top: 1px solid #2c2c2a; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #ffffff;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
      <span style="font-size: 10px;">Inicio</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #898781;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
      <span style="font-size: 10px;">Vuelos</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #898781;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14c2-3 5-3 7 0s5 3 7 0 3-3 4-1"/><circle cx="12" cy="6" r="2.5"/></svg>
      <span style="font-size: 10px;">Planificar</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #898781;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l2 2 4-4"/><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      <span style="font-size: 10px;">Operar</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #898781;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M4 12a8 8 0 0 1 .3-2.2l-2-1.6 2-3.4 2.4 1a8 8 0 0 1 1.9-1.1L9 2h6l.4 2.7a8 8 0 0 1 1.9 1.1l2.4-1 2 3.4-2 1.6a8 8 0 0 1 0 4.4l2 1.6-2 3.4-2.4-1a8 8 0 0 1-1.9 1.1L15 22H9l-.4-2.7a8 8 0 0 1-1.9-1.1l-2.4 1-2-3.4 2-1.6A8 8 0 0 1 4 12Z"/></svg>
      <span style="font-size: 10px;">Ajustes</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
