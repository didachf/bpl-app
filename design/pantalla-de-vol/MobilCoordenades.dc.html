        <button aria-pressed="false" style="height: 44px; border-radius: 7px; border: none; background: none; color: #c3c2b7; font-family: inherit; font-size: 15px;">Decimal</button>
        <button aria-pressed="false" style="height: 44px; border-radius: 7px; border: none; background: none; color: #c3c2b7; font-family: inherit; font-size: 15px;">Graus min s</button>
        <button aria-pressed="true" style="height: 44px; border-radius: 7px; border: none; background: #2a78d6; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 600;">UTM</button>

    <div style="display: grid; grid-template-columns: 84px minmax(0, 1fr) minmax(0, 1fr); gap: 8px;">

      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">

    <div style="font-size: 12px; color: #898781; margin-top: -6px;">ETRS89, com als mapes de l'ICGC</div>

      <div style="display: flex; justify-content: space-between; gap: 10px;"><span style="font-size: 13px; color: #898781;">Decimal</span><span class="num" style="font-size: 14px;">41,6857 N 1,2115 E</span></div>
      <div style="display: flex; justify-content: space-between; gap: 10px;"><span style="font-size: 13px; color: #898781;">Graus min s</span><span class="num" style="font-size: 14px;">41°41'08,7" N 1°12'41,5" E</span></div>
      <div style="display: flex; justify-content: space-between; gap: 10px;"><span style="font-size: 13px; color: #898781;">Des de l'enlairament</span><span class="num" style="font-size: 14px;">058° · 6,2 km</span></div>
    </div>

  <div style="padding: 14px 16px 24px 16px; border-top: 1px solid #2c2c2a;">
    <button style="width: 100%; height: 56px; border-radius: 8px; border: none; background: #2a78d6; color: #ffffff; font-family: inherit; font-size: 17px; font-weight: 500;">Desar al pla</button>

</div>
