<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #5598e7; } a:hover { color: #86b6ef; }
    .num { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .cap { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #898781; }
    .btn { width: 56px; height: 56px; border-radius: 8px; border: 1px solid #2c2c2a; display: flex; align-items: center; justify-content: center; color: #ffffff; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #1a1a19; color: #ffffff; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 4px 20px;">
    <div style="font-size: 24px; font-weight: 600; letter-spacing: -.02em;">Cerrar vuelo</div>
    <div style="font-size: 15px; color: #898781;">Cancelar</div>
  </div>
  <div style="padding: 0 20px 20px 20px; font-size: 14px; color: #c3c2b7;">Cuatro campos. El resto se completa en casa.</div>

  <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 26px;">

    <div>
      <div class="cap">Hora de aterrizaje</div>
      <div style="display: flex; align-items: center; gap: 14px; margin-top: 10px;">
        <div class="btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </div>
        <div class="num" style="font-size: 42px; font-weight: 500; flex-grow: 1; text-align: center;">08:37</div>
        <div class="btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </div>
      </div>
    </div>

    <div>
      <div class="cap">Dónde</div>
      <div style="margin-top: 10px; height: 56px; border-radius: 8px; border: 1px solid #2c2c2a; display: flex; align-items: center; gap: 11px; padding: 0 14px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2a78d6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-11a7 7 0 1 0-14 0c0 4.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <div style="flex-grow: 1;">
          <div class="num" style="font-size: 16px;">41.7712, 1.0384</div>
          <div style="font-size: 12px; color: #898781;">Posición actual, ±4 m</div>
        </div>
      </div>
    </div>

    <div>
      <div class="cap">Aterrizajes en este vuelo</div>
      <div style="display: flex; align-items: center; gap: 14px; margin-top: 10px;">
        <div class="btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </div>
        <div class="num" style="font-size: 42px; font-weight: 500; flex-grow: 1; text-align: center;">1</div>
        <div class="btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </div>
      </div>
    </div>

    <div>
      <div class="cap">Nota</div>
      <div style="margin-top: 10px; min-height: 76px; border-radius: 8px; border: 1px solid #2c2c2a; padding: 12px 14px; font-size: 15px; color: #898781;">Aterrizaje en rastrojo, viento en calma. Alberto firmó.</div>
    </div>

  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 20px 26px 20px;">
    <div style="height: 56px; border-radius: 8px; background: #2a78d6; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 500;">Guardar</div>
    <div style="text-align: center; font-size: 13px; color: #898781; margin-top: 12px;">Quedará marcado como incompleto</div>
  </div>

</div>
</x-dc>
</body>
</html>
